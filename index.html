<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Miembros</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#121212;
            color:white;
            font-family:Arial, Helvetica, sans-serif;
            min-height:100vh;
        }

        header{
            background:#1b1b1b;
            padding:40px;
            text-align:center;
        }

        h1{
            color:#4da3ff;
            font-size:3rem;
        }

        .contenedor{
            max-width:1000px;
            margin:auto;
            padding:50px 20px;
        }

        .tarjetas{
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
            gap:25px;
        }

        .tarjeta{
            background:#1e1e1e;
            padding:25px;
            border-radius:12px;
            box-shadow:0 0 10px rgba(0,0,0,0.3);
        }

        .tarjeta h2{
            color:#4da3ff;
            margin-bottom:10px;
        }

        .tarjeta p{
            color:#d4d4d4;
        }

        .boton{
            display:inline-block;
            margin-top:40px;
            background:#4da3ff;
            color:white;
            text-decoration:none;
            padding:14px 25px;
            border-radius:10px;
            font-weight:bold;
        }

        .boton:hover{
            background:#2f7ff1;
        }

        .volver{
            text-align:center;
        }

    </style>

</head>

<body>

<header>
    <h1>Miembros del Proyecto</h1>
</header>

<div class="contenedor">

    <div class="tarjetas">

        <div class="tarjeta">
            <h2>Raúl Cacho</h2>
            <p>
                Profesor de Ingeniería Informática.
            </p>
        </div>

        <div class="tarjeta">
            <h2>Miembro 2</h2>
            <p>
                Diseño y documentación.
            </p>
        </div>

        <div class="tarjeta">
            <h2>Miembro 3</h2>
            <p>
                Desarrollo frontend.
            </p>
        </div>

    </div>

    <div class="volver">

        <a class="boton" href="https://rcd98.github.io">
            Volver al inicio
        </a>

    </div>

</div>

</body>

</html>
